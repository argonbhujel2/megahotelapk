name: mega_hotel_delivery
description: Mega Hotel — Restaurant Ordering & Delivery Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  intl: 0.20.3
  uuid: ^4.5.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/onboarding/
    - assets/branding/
  # fonts can be added later
